apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bgd-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rosehs00/gitops-lab.git
    path: .
    targetRevision: main
  destination:
    namespace: bgd
    server: https://kubernetes.default.svc
