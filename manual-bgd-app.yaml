apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bgd-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/myanjini/gitops-lab.git		⇐ 본인의 깃허브 주소로 변경
    path: /
    targetRevision: main
  destination:
    namespace: bgd
    server: https://kubernetes.default.svc